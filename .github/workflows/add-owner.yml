# One-off: invite gedejong, the account mtr-ng now lives under, to own the crate
# on crates.io. The next commit removes this workflow again.
name: Add crate owner

on:
  push:
    branches: [master]
    paths: [".github/workflows/add-owner.yml"]

permissions: {}

jobs:
  add-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Invite gedejong as an owner of mtr-ng
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "The CARGO_REGISTRY_TOKEN secret is not set"
            exit 1
          fi
          cargo owner --add gedejong mtr-ng
          cargo owner --list mtr-ng
